[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
  # Canonical URLs + sitemap. Must match the live host (apex). If Netlify UI
  # still has www, change it there — UI env vars override this file.
  PUBLIC_SITE_URL = "https://perdiemcalculator.com"
  # Also set in Netlify UI (required for the calculator):
  # PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY
  # Contact form: Forms → notifications → email (inbox is not published in site HTML)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Frameless calculator for publisher iframes (overrides DENY above).
[[headers]]
  for = "/embed"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/embed/"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Google Search Console HTML-file verification (must be text/html at site root).
[[headers]]
  for = "/googled029c553c086b3e3.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
